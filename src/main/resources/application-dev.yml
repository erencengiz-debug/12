# ════════════════════════════════════════════════════════════
#  DEV profili — env variable'lardan okunur, asla hardcode etme
# ════════════════════════════════════════════════════════════

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

app:
  cookie:
    secure: false   # dev'de HTTPS zorunlu değil

logging:
  level:
    com.sase.app: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
