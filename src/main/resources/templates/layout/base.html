<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE – Şase Eşleştirme">Şase Eşleştirme</title>
    <link rel="icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-w: 240px;
            --brand-dark: #1a3a5c;
            --brand-mid: #2b5797;
        }
        body { background: #f0f2f5; font-size: .9rem; }

        /* ── Sidebar ── */
        #sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: var(--sidebar-w);
            background: var(--brand-dark);
            display: flex; flex-direction: column;
            z-index: 1040;
        }
        #sidebar .brand {
            padding: 1.1rem 1.25rem;
            font-size: 1rem; font-weight: 700;
            color: #fff; letter-spacing: -.3px;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }
        #sidebar .nav-link {
            color: rgba(255,255,255,.7);
            padding: .55rem 1.25rem;
            border-radius: 6px;
            margin: 1px 8px;
            transition: background .15s, color .15s;
        }
        #sidebar .nav-link:hover,
        #sidebar .nav-link.active {
            background: rgba(255,255,255,.12);
            color: #fff;
        }
        #sidebar .nav-link .bi { width: 20px; text-align: center; margin-right: 8px; }
        #sidebar .nav-section {
            font-size: .7rem; font-weight: 600; letter-spacing: .08em;
            color: rgba(255,255,255,.4); text-transform: uppercase;
            padding: .75rem 1.25rem .25rem;
        }
        #sidebar .user-area {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,.1);
            padding: .9rem 1.25rem;
        }

        /* ── Main content ── */
        #main-wrap {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
        }
        .page-header { padding: 1.5rem 1.75rem .5rem; }
        .page-header h1 { font-size: 1.35rem; font-weight: 700; margin: 0; }
        .page-body { padding: .75rem 1.75rem 2rem; }

        /* ── Cards ── */
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
        .stat-icon { width: 44px; height: 44px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }

        /* ── Table ── */
        .table > :not(caption) > * > * { padding: .6rem .9rem; vertical-align: middle; }
        .table thead th { font-size: .75rem; font-weight: 600; letter-spacing: .06em;
            text-transform: uppercase; color: #6c757d; background: #f8f9fa; border-bottom: 2px solid #dee2e6; }

        /* ── Badges ── */
        .badge { font-weight: 500; }

        @media (max-width: 767px) {
            #sidebar { transform: translateX(-100%); }
            #main-wrap { margin-left: 0; }
        }
    </style>
    <th:block layout:fragment="head-extra"></th:block>
</head>
<body>

<!-- ══════════════════════ SIDEBAR ══════════════════════ -->
<nav id="sidebar">
    <div class="brand">
        <i class="bi bi-car-front-fill me-2"></i>Şase Eşleştirme
    </div>

    <div class="mt-2">
        <span class="nav-section">Genel</span>
        <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" th:href="@{/}">
            <i class="bi bi-speedometer2"></i>Dashboard
        </a>

        <span class="nav-section">Stok</span>
        <a class="nav-link" th:classappend="${activePage == 'stok'} ? 'active'" th:href="@{/stok}">
            <i class="bi bi-archive"></i>Stok Listesi
        </a>

        <span class="nav-section">İşlemler</span>
        <a class="nav-link" th:classappend="${activePage == 'sase'} ? 'active'" th:href="@{/sase}">
            <i class="bi bi-diagram-3"></i>Şase Eşleştirme
        </a>
        <a class="nav-link" th:classappend="${activePage == 'not'} ? 'active'" th:href="@{/not}">
            <i class="bi bi-journal-text"></i>Notlar
        </a>
    </div>

    <div class="user-area">
        <div class="text-white-50 small mb-2">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name">Kullanıcı</span>
        </div>
        <form method="post" th:action="@{/logout}">
            <button class="btn btn-sm btn-outline-light w-100">
                <i class="bi bi-box-arrow-right me-1"></i>Çıkış Yap
            </button>
        </form>
    </div>
</nav>

<!-- ══════════════════════ MAIN ══════════════════════ -->
<div id="main-wrap">

    <!-- Flash mesajları -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show m-3 mb-0 py-2" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show m-3 mb-0 py-2" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <layout:fragment name="content">
        <!-- sayfa içeriği buraya gelir -->
    </layout:fragment>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
