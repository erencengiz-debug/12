<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş – Autotarget · Şase Eşleştirme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a3a5c 0%, #0d1f33 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.45);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
        }
        .form-control:focus {
            border-color: #1a3a5c;
            box-shadow: 0 0 0 0.2rem rgba(26,58,92,0.2);
        }
        .btn-login {
            background-color: #1a3a5c;
            border-color: #1a3a5c;
            font-weight: 600;
        }
        .btn-login:hover {
            background-color: #142e4a;
            border-color: #142e4a;
        }
        .input-group-text {
            background: #f8f9fa;
            border-right: none;
            color: #6c757d;
        }
        .form-control.icon-input { border-left: none; }
    </style>
</head>
<body>
    <div class="text-center" style="max-width:420px; width:100%; padding:1rem;">

        <div style="font-size:.7rem; font-weight:700; letter-spacing:3px; color:rgba(255,255,255,.6); text-transform:uppercase; margin-bottom:4px;">
            Autotarget
        </div>
        <div style="font-size:1.4rem; font-weight:700; color:#fff; margin-bottom:2rem;">
            Şase Eşleştirme Sistemi
        </div>

        <div class="login-card">
            <h5 class="fw-semibold mb-1" style="color:#1a3a5c;">Hoş Geldiniz</h5>
            <p class="text-muted small mb-4">Sisteme erişmek için giriş yapın</p>

            <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center gap-2 py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMsg}"></span>
            </div>
            <div th:if="${serviceErrorMsg}" class="alert alert-warning d-flex align-items-center gap-2 py-2 small" role="alert">
                <i class="bi bi-wifi-off"></i>
                <span th:text="${serviceErrorMsg}"></span>
            </div>
            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 py-2 small" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span>Başarıyla çıkış yaptınız.</span>
            </div>

            <form method="post" th:action="@{/login}" novalidate id="loginForm">
                <div class="mb-3 text-start">
                    <label for="email" class="form-label small fw-medium text-secondary">E-posta Adresi</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control icon-input"
                               placeholder="ad.soyad@firma.com" autocomplete="email" required autofocus>
                    </div>
                </div>
                <div class="mb-4 text-start">
                    <label for="password" class="form-label small fw-medium text-secondary">Şifre</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control icon-input"
                               placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-login btn-primary w-100 py-2">
                    <span id="btnNormal">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Giriş Yap
                    </span>
                    <span id="btnLoading" class="d-none">
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        Giriş yapılıyor…
                    </span>
                </button>
            </form>
        </div>

        <p class="mt-4 mb-0 small" style="color:rgba(255,255,255,.4);">
            &copy; 2026 Autotarget · Tüm hakları saklıdır
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function () {
            var btn = document.getElementById('loginBtn');
            if (!this.checkValidity()) return;
            btn.disabled = true;
            document.getElementById('btnNormal').classList.add('d-none');
            document.getElementById('btnLoading').classList.remove('d-none');
        });
    </script>
</body>
</html>
