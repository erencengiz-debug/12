<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="tr">
<head>
    <title>Dashboard</title>
</head>
<body>
<th:block layout:fragment="content">

    <div class="page-header">
        <h1><i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard</h1>
        <p class="text-muted mb-0">Hoş geldiniz, <strong th:text="${email} ?: 'Kullanıcı'"></strong></p>
    </div>

    <div class="page-body">

        <!-- İstatistik Kartları -->
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon" style="background:#e8f0fe; color:#1a3a5c;">
                            <i class="bi bi-archive"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Toplam Stok</div>
                            <div class="fw-bold fs-5" th:text="${stokSayisi} ?: '–'"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon" style="background:#fce8e6; color:#c5221f;">
                            <i class="bi bi-diagram-3"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Şase Eşleştirme</div>
                            <div class="fw-bold fs-5" th:text="${saseSayisi} ?: '–'"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon" style="background:#e6f4ea; color:#137333;">
                            <i class="bi bi-journal-text"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Notlar</div>
                            <div class="fw-bold fs-5" th:text="${notSayisi} ?: '–'"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon" style="background:#fef7e0; color:#b45309;">
                            <i class="bi bi-check2-circle"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Tamamlanan Eşleştirme</div>
                            <div class="fw-bold fs-5" th:text="${tamamlananSayisi} ?: '–'"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hızlı Erişim -->
        <div class="row g-3">
            <div class="col-md-6">
                <div class="card p-4">
                    <h6 class="fw-semibold mb-3"><i class="bi bi-diagram-3 me-2 text-danger"></i>Şase Eşleştirme</h6>
                    <p class="text-muted small mb-3">
                        Şase kodlarına göre stokları eşleştirin, sonuçları görüntüleyin.
                    </p>
                    <a th:href="@{/sase/yeni}" class="btn btn-sm btn-primary me-2">
                        <i class="bi bi-plus-lg me-1"></i>Yeni Eşleştirme
                    </a>
                    <a th:href="@{/sase}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-list me-1"></i>Tümünü Gör
                    </a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4">
                    <h6 class="fw-semibold mb-3"><i class="bi bi-archive me-2 text-primary"></i>Stok</h6>
                    <p class="text-muted small mb-3">
                        Stok listesini görüntüleyin, arama yapın ve detayları inceleyin.
                    </p>
                    <a th:href="@{/stok}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-search me-1"></i>Stok Ara
                    </a>
                </div>
            </div>
        </div>

    </div>
</th:block>
</body>
</html>
