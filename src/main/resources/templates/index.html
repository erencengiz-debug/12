<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard – Şase Eşleştirme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar-brand { font-weight: 700; letter-spacing: -0.3px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
        .stat-icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#1a3a5c;">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/"><i class="bi bi-car-front-fill me-2"></i>Şase Eşleştirme</a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <span class="text-white-50 small d-none d-md-inline">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${email} ?: 'Kullanıcı'"></span>
                </span>
                <form method="post" th:action="@{/logout}" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Çıkış
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="mb-4">
            <h4 class="fw-bold mb-1">Dashboard</h4>
            <p class="text-muted mb-0">Hoş geldiniz, <strong th:text="${email} ?: 'Kullanıcı'"></strong></p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon" style="background:#e8f0fe; color:#1a3a5c;"><i class="bi bi-archive"></i></div>
                        <div><div class="text-muted small">Toplam Stok</div><div class="fw-bold fs-5">–</div></div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon" style="background:#fce8e6; color:#c5221f;"><i class="bi bi-car-front"></i></div>
                        <div><div class="text-muted small">Şase Eşleştirme</div><div class="fw-bold fs-5">–</div></div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon" style="background:#e6f4ea; color:#137333;"><i class="bi bi-arrow-down-circle"></i></div>
                        <div><div class="text-muted small">Bugünkü Alış</div><div class="fw-bold fs-5">–</div></div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon" style="background:#fef7e0; color:#b45309;"><i class="bi bi-arrow-up-circle"></i></div>
                        <div><div class="text-muted small">Bugünkü Çıkış</div><div class="fw-bold fs-5">–</div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card p-4">
            <p class="text-muted mb-0">
                <i class="bi bi-info-circle me-2"></i>Sistem hazır. Menü ve modüller geliştirme aşamasında.
            </p>
        </div>
    </div>

</body>
</html>
