<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="tr">
<head>
    <title>Anasayfa</title>
    <th:block layout:fragment="head-extra">
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/dashboard-calendar.css}">
    </th:block>
</head>
<body>
<th:block layout:fragment="content">

    <div class="page-body pt-2 pb-4 px-2 px-md-3">

        <div class="home-calendar-shell mx-auto">
            <!-- Üst: kullanıcı -->
            <div class="home-cal-userrow">
                <div class="user-line">
                    <th:block th:if="${currentUser != null}"
                              th:with="ku=${currentUser.kullaniciAdi()},
                                       line=${ku != null and !#strings.isEmpty(ku) ? currentUser.displayName() + ' - ' + ku : currentUser.displayName()}">
                        <span th:text="${line}">Kullanıcı</span>
                    </th:block>
                    <span th:if="${currentUser == null}"
                          th:text="${email != null and !#strings.isEmpty(email) ? email : 'Kullanıcı'}">Kullanıcı</span>
                </div>
            </div>

            <div class="home-cal-tabbar">
                <div class="home-cal-tab">Takvim</div>
            </div>

            <div class="home-cal-toolbar">
                <div class="home-cal-toolbar-left">
                    <button type="button" class="home-cal-circle-btn" id="homeCalPrev" title="Önceki"
                            aria-label="Önceki">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button type="button" class="home-cal-btn-today" id="homeCalToday">Bugün</button>
                    <button type="button" class="home-cal-circle-btn" id="homeCalNext" title="Sonraki"
                            aria-label="Sonraki">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
                <div class="home-cal-toolbar-center">
                    <h2 class="home-cal-toolbar-title" id="homeCalTitle">Takvim</h2>
                </div>
                <div class="home-cal-toolbar-right">
                    <button type="button" class="home-cal-view-btn" data-cal-view="timeGridDay">Gün</button>
                    <button type="button" class="home-cal-view-btn" data-cal-view="timeGridWorkWeek">İş Haftası</button>
                    <button type="button" class="home-cal-view-btn" data-cal-view="timeGridWeek">Hafta</button>
                    <button type="button" class="home-cal-view-btn" data-cal-view="dayGridMonth">Ay</button>
                    <button type="button" class="home-cal-view-btn" data-cal-view="listWeek">Zaman Çizelgesi</button>
                </div>
            </div>

            <div class="home-cal-stage position-relative">
                <button type="button" class="home-cal-arrow-fab prev" id="homeCalFabPrev" aria-label="Önceki">
                    <i class="bi bi-chevron-left fs-5"></i>
                </button>
                <div id="dashCalendar"></div>
                <button type="button" class="home-cal-arrow-fab next" id="homeCalFabNext" aria-label="Sonraki">
                    <i class="bi bi-chevron-right fs-5"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Sabit Not paneli -->
    <div id="homeNoteDock" class="home-note-dock">
        <div id="homeNotePanel" class="home-note-panel">
            <div class="home-note-panel-header">
                <span>Not</span>
                <button type="button" id="homeNoteClose" class="home-note-close" aria-label="Kapat">&times;</button>
            </div>
            <textarea id="homeNoteTextarea"
                      class="home-note-textarea"
                      placeholder="Notlarınızı buraya yazın; tarayıcıda saklanır."></textarea>
            <div class="home-note-hint">Bu not sadece bu tarayıcıda, sizin oturumunuza bağlı olarak saklanır.</div>
        </div>
        <button type="button" id="homeNoteFab" class="home-note-fab">Not&nbsp;📝</button>
    </div>

</th:block>

<th:block layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/locales-all.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.__DASH_USER_ID = /*[[${userId != null ? userId : ''}]]*/ '';
        /*]]>*/
    </script>
    <script defer th:src="@{/js/dashboard-calendar.js}"></script>
</th:block>
</body>
</html>
