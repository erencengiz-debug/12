<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="tr">
<head>
    <title>Stok Detayı</title>
</head>
<body>
<th:block layout:fragment="content">

    <div class="page-header d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div>
            <h1>
                <i class="bi bi-archive me-2 text-primary"></i>
                <span th:text="${stok.stokAdi}"></span>
            </h1>
            <p class="text-muted mb-0">
                <code th:text="${stok.stokKodu} ?: ''"></code>
                <span th:if="${stok.orjKodu}" class="ms-2 text-muted">
                    · Orijinal: <code th:text="${stok.orjKodu}"></code>
                </span>
            </p>
        </div>
        <a th:href="@{/stok}" class="btn btn-sm btn-outline-secondary mt-1">
            <i class="bi bi-arrow-left me-1"></i>Geri
        </a>
    </div>

    <div class="page-body">
        <div class="row g-3">

            <!-- Genel Bilgiler -->
            <div class="col-lg-6">
                <div class="card p-4">
                    <h6 class="fw-semibold mb-3">Genel Bilgiler</h6>
                    <dl class="row mb-0 small">
                        <dt class="col-sm-5 text-muted">Stok Adı</dt>
                        <dd class="col-sm-7 fw-semibold" th:text="${stok.stokAdi}"></dd>

                        <dt class="col-sm-5 text-muted">Alternatif Ad</dt>
                        <dd class="col-sm-7" th:text="${stok.alternatifStokAdi} ?: '–'"></dd>

                        <dt class="col-sm-5 text-muted">Kısa İsim</dt>
                        <dd class="col-sm-7" th:text="${stok.kisaIsmi} ?: '–'"></dd>

                        <dt class="col-sm-5 text-muted">Marka</dt>
                        <dd class="col-sm-7" th:text="${stok.marka} ?: '–'"></dd>

                        <dt class="col-sm-5 text-muted">Model Kodu</dt>
                        <dd class="col-sm-7" th:text="${stok.modelKodu} ?: '–'"></dd>

                        <dt class="col-sm-5 text-muted">Kategori</dt>
                        <dd class="col-sm-7">
                            <span th:if="${stok.kategori1}" class="badge bg-light text-dark border"
                                  th:text="${stok.kategori1}"></span>
                            <span th:if="${stok.kategori2}" class="badge bg-light text-dark border ms-1"
                                  th:text="${stok.kategori2}"></span>
                            <span th:unless="${stok.kategori1 or stok.kategori2}">–</span>
                        </dd>

                        <dt class="col-sm-5 text-muted">Stok Durumu</dt>
                        <dd class="col-sm-7">
                            <span th:if="${stok.stokStatus}" class="badge bg-success-subtle text-success">Aktif</span>
                            <span th:unless="${stok.stokStatus}" class="badge bg-secondary-subtle text-secondary">Pasif</span>
                            <span th:if="${stok.bakim}" class="badge bg-warning-subtle text-warning ms-1">Bakım</span>
                            <span th:if="${stok.rektifiye}" class="badge bg-info-subtle text-info ms-1">Rektifiye</span>
                        </dd>
                    </dl>
                </div>
            </div>

            <!-- Fiyat ve Stok -->
            <div class="col-lg-6">
                <div class="card p-4">
                    <h6 class="fw-semibold mb-3">Fiyat & Stok</h6>
                    <dl class="row mb-0 small">
                        <dt class="col-sm-5 text-muted">Fiyat 1</dt>
                        <dd class="col-sm-7 fw-semibold"
                            th:text="${stok.fiyat1 != null} ? ${#numbers.formatDecimal(stok.fiyat1,1,'POINT',2,'COMMA')} + ' ₺' : '–'"></dd>

                        <dt class="col-sm-5 text-muted">Fiyat 7</dt>
                        <dd class="col-sm-7"
                            th:text="${stok.fiyat7 != null} ? ${#numbers.formatDecimal(stok.fiyat7,1,'POINT',2,'COMMA')} + ' ₺' : '–'"></dd>

                        <dt class="col-sm-5 text-muted">Fiyat 10</dt>
                        <dd class="col-sm-7"
                            th:text="${stok.fiyat10 != null} ? ${#numbers.formatDecimal(stok.fiyat10,1,'POINT',2,'COMMA')} + ' ₺' : '–'"></dd>

                        <dt class="col-sm-5 text-muted">Depo Merkez</dt>
                        <dd class="col-sm-7">
                            <span th:text="${stok.depoMerkez} ?: 0"
                                  th:classappend="${(stok.depoMerkez ?: 0) > 0} ? 'text-success fw-semibold' : 'text-danger'"></span>
                        </dd>

                        <dt class="col-sm-5 text-muted">Depo Toplam</dt>
                        <dd class="col-sm-7" th:text="${stok.depoToplam} ?: 0"></dd>

                        <dt class="col-sm-5 text-muted">Web Yayın</dt>
                        <dd class="col-sm-7">
                            <span th:if="${stok.webStatus}" class="badge bg-success-subtle text-success">Yayında</span>
                            <span th:unless="${stok.webStatus}" class="badge bg-secondary-subtle text-secondary">Yayında Değil</span>
                        </dd>
                    </dl>
                </div>
            </div>

        </div>
    </div>
</th:block>
</body>
</html>
