<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="tr">
<head>
    <title>Stok Listesi</title>
</head>
<body>
<th:block layout:fragment="content">

    <div class="page-header d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div>
            <h1><i class="bi bi-archive me-2 text-primary"></i>Stok Listesi</h1>
            <p class="text-muted mb-0" th:text="|Toplam ${stoklar.size()} kayıt|"></p>
        </div>
    </div>

    <div class="page-body">

        <!-- Arama -->
        <div class="card p-3 mb-3">
            <form th:action="@{/stok}" method="get" class="d-flex gap-2">
                <input type="search" name="q" class="form-control form-control-sm"
                       placeholder="Stok adı, kodu veya orijinal kod ile ara…"
                       th:value="${q}" style="max-width:380px;">
                <button class="btn btn-sm btn-primary" type="submit">
                    <i class="bi bi-search me-1"></i>Ara
                </button>
                <a th:if="${q}" th:href="@{/stok}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-x-lg"></i>
                </a>
            </form>
        </div>

        <!-- Tablo -->
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Stok Kodu</th>
                        <th>Stok Adı</th>
                        <th>Marka</th>
                        <th>Kategori</th>
                        <th class="text-end">Fiyat 1</th>
                        <th class="text-center">Depo (Merkez)</th>
                        <th class="text-center">Durum</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${stoklar.empty}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Kayıt bulunamadı.
                        </td>
                    </tr>
                    <tr th:each="s : ${stoklar}">
                        <td>
                            <code th:text="${s.stokKodu} ?: '–'"></code>
                        </td>
                        <td>
                            <span class="fw-semibold" th:text="${s.stokAdi}"></span>
                            <div th:if="${s.kisaIsmi}" class="text-muted small" th:text="${s.kisaIsmi}"></div>
                        </td>
                        <td th:text="${s.marka} ?: '–'"></td>
                        <td>
                            <span th:if="${s.kategori1}" th:text="${s.kategori1}"
                                  class="badge bg-light text-dark border"></span>
                            <span th:if="${s.kategori2}" th:text="${s.kategori2}"
                                  class="badge bg-light text-dark border ms-1"></span>
                        </td>
                        <td class="text-end" th:text="${s.fiyat1 != null} ? ${#numbers.formatDecimal(s.fiyat1, 1, 'POINT', 2, 'COMMA')} + ' ₺' : '–'"></td>
                        <td class="text-center">
                            <span th:text="${s.depoMerkez} ?: 0"
                                  th:classappend="${(s.depoMerkez ?: 0) > 0} ? 'text-success fw-semibold' : 'text-danger'"></span>
                        </td>
                        <td class="text-center">
                            <span th:if="${s.stokStatus}" class="badge bg-success-subtle text-success">Aktif</span>
                            <span th:unless="${s.stokStatus}" class="badge bg-secondary-subtle text-secondary">Pasif</span>
                        </td>
                        <td>
                            <a th:href="@{/stok/{id}(id=${s.id})}" class="btn btn-sm btn-outline-primary py-0">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</th:block>
</body>
</html>
