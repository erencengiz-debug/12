<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="tr">
<head>
    <title>Yeni Not</title>
</head>
<body>
<th:block layout:fragment="content">

    <div class="page-header">
        <h1><i class="bi bi-plus-circle me-2 text-primary"></i>Yeni Not</h1>
    </div>

    <div class="page-body">
        <div class="card p-4" style="max-width: 600px;">

            <div th:if="${errors}" class="alert alert-danger py-2 mb-3">
                <ul class="mb-0 ps-3">
                    <li th:each="err : ${errors}" th:text="${err.defaultMessage}"></li>
                </ul>
            </div>

            <form th:action="@{/not}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Başlık <span class="text-danger">*</span></label>
                    <input type="text" name="baslik" class="form-control" required
                           placeholder="Not başlığı" autofocus maxlength="200">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tarih <span class="text-danger">*</span></label>
                    <input type="date" name="tarih" class="form-control" required
                           th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Açıklama</label>
                    <textarea name="aciklama" class="form-control" rows="5"
                              placeholder="Not içeriği…" maxlength="5000"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Kaydet
                    </button>
                    <a th:href="@{/not}" class="btn btn-outline-secondary">İptal</a>
                </div>

            </form>
        </div>
    </div>
</th:block>
</body>
</html>
