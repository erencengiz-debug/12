<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="tr">
<head>
    <title>Notlar</title>
</head>
<body>
<th:block layout:fragment="content">

    <div class="page-header d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div>
            <h1><i class="bi bi-journal-text me-2 text-success"></i>Notlar</h1>
            <p class="text-muted mb-0" th:text="|Toplam ${notlar.size()} not|"></p>
        </div>
        <a th:href="@{/not/yeni}" class="btn btn-primary btn-sm mt-1">
            <i class="bi bi-plus-lg me-1"></i>Yeni Not
        </a>
    </div>

    <div class="page-body">

        <div th:if="${notlar.empty}" class="card p-5 text-center text-muted">
            <i class="bi bi-journal fs-2 d-block mb-2"></i>
            Henüz not eklenmemiş.
            <a th:href="@{/not/yeni}" class="d-block mt-2">İlk notu ekle</a>
        </div>

        <div class="row g-3" th:unless="${notlar.empty}">
            <div class="col-md-6 col-xl-4" th:each="n : ${notlar}">
                <div class="card p-3 h-100 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="fw-semibold mb-0" th:text="${n.baslik}"></h6>
                        <span class="text-muted small ms-2 text-nowrap"
                              th:text="${#temporals.format(n.tarih, 'dd.MM.yyyy')}"></span>
                    </div>
                    <p class="text-muted small mb-0 flex-grow-1"
                       th:text="${n.aciklama} ?: 'Açıklama yok.'"
                       style="white-space: pre-wrap;"></p>
                    <div class="mt-3 d-flex justify-content-end">
                        <form th:action="@{/not/{id}/sil(id=${n.id})}" method="post"
                              onsubmit="return confirm('Bu notu silmek istediğinize emin misiniz?')">
                            <button class="btn btn-sm btn-outline-danger py-0">
                                <i class="bi bi-trash me-1"></i>Sil
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</th:block>
</body>
</html>
