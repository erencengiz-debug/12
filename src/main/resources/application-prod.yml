# ════════════════════════════════════════════════════════════
#  PROD profili — tüm hassas değerler env variable'dan gelir
# ════════════════════════════════════════════════════════════

spring:
  # ─── DevTools ── prod'da kesinlikle devre dışı ──────────
  devtools:
    add-properties: false
    restart:
      enabled: false
    livereload:
      enabled: false

  # ─── JPA / Hibernate ────────────────────────────────────
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # ─── Thymeleaf ──────────────────────────────────────────
  thymeleaf:
    cache: true

# ─── Cookie ─────────────────────────────────────────────────
app:
  cookie:
    secure: true        # prod'da HTTPS zorunlu → Secure flag
    same-site: Strict   # dev'de Lax, prod'da Strict

# ─── Server ─────────────────────────────────────────────────
server:
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 2048
  servlet:
    session:
      cookie:
        secure: true
        http-only: true

# ─── Logging ────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.sase.app: INFO          # uygulama logları INFO'da kalsın
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: INFO          # migration logları görülsün
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
